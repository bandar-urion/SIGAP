[DATABASE]
# Nombre del archivo de la base de datos
NAME = sigap.db
# Carpeta donde reside (relativa a la raíz del proyecto)
DIR = data

[PATHS]
# Rutas de las carpetas de trabajo para los Excel
INBOX = data/inbox
PROCESSED = data/processed
REJECTED = data/rejected

[UI]
# Configuraciones de la Torre de Control (para no hardcodearlas en ui.py)
VIEWPORT_HEIGHT = 10
PANEL_HEIGHT = 6

[SYSTEM]
# Nivel de detalle del registro técnico (INFO, DEBUG, WARNING, ERROR)
LOG_LEVEL = INFO
